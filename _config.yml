#
# This file contains configuration flags to customize your site
#

# Name of your site (displayed in the header)
title: Matthias Humt
author: Matthias Humt
tagline: Blog of Matthias Humt, PhD student, Researcher, Visualizer.

# Short bio or description (displayed in the header)
description: PhD student at TU Munich<br> Researcher with the German Aerospace Center (DLR)<br> Visualization Aficionado

# URL of your avatar or profile pic (you could use your GitHub profile pic)
avatar: https://avatars.githubusercontent.com/u/22399283?v=4
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      comments: true
  - scope:
      path: "index.md"
    values:
      image: https://assets.hummat.com/images/preview.png

#
# Flags below are optional
#

# Includes an icon in the footer for each username you enter
footer-links:
  dribbble:
  email: blog.hash136@passmail.net
  facebook:
  flickr:
  github: hummat
  instagram:
  linkedin: matthiashumt
  pinterest:
  rss: # just type anything here for a working RSS icon
  bsky: profile/hummat.bsky.social
  twitter:
  stackoverflow: /users/15425629/hummat # your stackoverflow profile, e.g. "users/50476/bart-kiers"
  youtube: # channel/<your_long_string> or user/<user-name>
  googleplus: # anything in your profile username that comes after plus.google.com/

# Comments provider configuration.
# Supported provider:
# - giscus (GitHub Discussions-based comments)
# - utterances (GitHub Issues-based comments)
# - disqus (Disqus-hosted comments)
comments:
  provider: giscus

giscus:
  repo: hummat/hummat.github.io
  repo_id: MDEwOlJlcG9zaXRvcnkyNjM2MDE4OTY=
  category: General
  category_id: DIC_kwDOD7Y-6M4C1Coy
  mapping: pathname
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: top
  theme: preferred_color_scheme
  lang: en

utterances:
  repo: hummat/hummat.github.io
  issue_term: pathname
  label: comments
  theme: preferred-color-scheme

# Set to your Disqus shortname when using comments.provider: disqus.
# Example: disqus: my-site-shortname
disqus:

# Enter your Google Analytics GA4 measurement ID (e.g. G-XXXXXXXXXX) to activate tracking.
# Leave empty to disable analytics.
google_analytics:

# Your website URL (e.g. http://barryclark.github.io or http://www.barryclark.co)
# Used for Sitemap.xml and your RSS feed
url: https://hummat.com

# If you're hosting your site at a Project repository on GitHub pages
# (http://yourusername.github.io/repository-name)
# and NOT your User repository (http://yourusername.github.io)
# then add in the baseurl here, like this: "/repository-name"
baseurl: ""

#
# !! You don't need to change any of the configuration flags below !!
#

# permalink: /:title/

# The release of Jekyll Now that you're using
version: v3.9.0

# Jekyll a now only supports Kramdown for Markdown
# markdown: CommonMarkGhPages
markdown: kramdown
highlighter: rouge

#commonmark:
#  input: GFM
#  options: ["SMART", "FOOTNOTES", "LIBERAL_HTML_TAG"]
#  extensions: ["strikethrough", "autolink", "table", "tagfilter"]
#  syntax_highlighter: rouge
#  syntax_highlighter_opts:
#    css_class: 'highlight'

#CommonMarkGhPages:
#  input: GFM
#  syntax_highlighter: rouge
#  syntax_highlighter_opts:
#    css_class: 'highlight'

kramdown:
  # Use GitHub flavored markdown, including triple backtick fenced code blocks
  input: GFM
  # Jekyll 3 and GitHub Pages now only support rouge for syntax highlighting
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    # Use existing pygments syntax highlighting css
    css_class: "highlight"

# Set the Sass partials directory, as we're using @imports
sass:
  style: :compressed # You might prefer to minify using :compressed

# Use the following plug-ins
plugins:
  - jekyll-sitemap # Create a sitemap using the official Jekyll sitemap gem
  - jekyll-feed # Create an Atom feed using the official Jekyll feed gem
  - jekyll-seo-tag
  - jemoji

include:
  - _redirects

# Exclude these files from your production _site
exclude:
  #  - Gemfile
  - LICENSE
  - README.md
  - CNAME
  - Gemfile.lock
  - node_modules
  - vendor

# Custom headers
# webrick:
#   headers:
#     Access-Control-Allow-Origin: "*"

# Semantic Scholar configuration for Publications page
# Set this to your Semantic Scholar author ID (numeric or alphanumeric),
# for example: 1741101
semantic_scholar_author_id: 1753619041
