name: Close Issues on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [netlify]

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prBody = context.payload.pull_request.body || '';

            // Keywords that indicate issue closure (GitHub native + common extras)
            const keywords = [
              'close[sd]?', 'fix(?:e[sd])?', 'resolve[sd]?',  // GitHub native
              'implement[sd]?', 'complete[sd]?', 'address(?:e[sd])?'  // common extras
            ].join('|');

            // Two-pass approach: first find keyword + blob of refs, then extract
            // each issue number from the blob.  A single-regex approach loses
            // middle refs because JS repeated capture groups only keep the last match.
            const ref = `(?:#\\d+|https?://github\\.com/[^/]+/[^/]+/issues/\\d+)`;
            const keywordPattern = new RegExp(
              `(?:${keywords})[:\\s-]*` +
              `(${ref}(?:[,\\s]+(?:and\\s+)?${ref})*)`,
              'gi'
            );
            const refPattern = /#(\d+)|https?:\/\/github\.com\/[^/]+\/[^/]+\/issues\/(\d+)/g;

            // Extract all issue numbers from matches
            const issueNumbers = [];
            for (const match of prBody.matchAll(keywordPattern)) {
              for (const ref of match[1].matchAll(refPattern)) {
                issueNumbers.push(parseInt(ref[1] || ref[2], 10));
              }
            }
            // Deduplicate
            const uniqueIssues = [...new Set(issueNumbers)];

            if (uniqueIssues.length === 0) {
              console.log('No closing keywords found in PR body');
              return;
            }

            console.log(`Found issue references: ${uniqueIssues.join(', ')}`);

            for (const issueNumber of uniqueIssues) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });

                if (issue.state === 'open') {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    state: 'closed',
                    state_reason: 'completed'
                  });
                  console.log(`Closed issue #${issueNumber}`);

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: `Closed via #${prNumber}`
                  });
                } else {
                  console.log(`Issue #${issueNumber} already closed`);
                }
              } catch (error) {
                console.log(`Could not process issue #${issueNumber}: ${error.message}`);
              }
            }
