name: Close Issues on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [netlify]

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Close linked issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prBody = context.payload.pull_request.body || '';

            const { extractClosingIssueReferences } = require('./.github/scripts/closing-issues.cjs');
            const { issueNumbers: uniqueIssues, skippedReferences } = extractClosingIssueReferences(
              prBody,
              context.repo.owner,
              context.repo.repo
            );

            if (uniqueIssues.length === 0) {
              console.log('No closing keywords found in PR body');
              return;
            }

            if (skippedReferences.length > 0) {
              console.log(`Skipped cross-repo references: ${skippedReferences.join(', ')}`);
            }

            console.log(`Found issue references: ${uniqueIssues.join(', ')}`);

            for (const issueNumber of uniqueIssues) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });

                if (issue.state === 'open') {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    state: 'closed',
                    state_reason: 'completed'
                  });
                  console.log(`Closed issue #${issueNumber}`);

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: `Closed via #${prNumber}`
                  });
                } else {
                  console.log(`Issue #${issueNumber} already closed`);
                }
              } catch (error) {
                console.log(`Could not process issue #${issueNumber}: ${error.message}`);
              }
            }
